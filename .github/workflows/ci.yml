name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # catches date bugs around daylight saving time
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: tools/fetch-sqlite.sh
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build -d
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: No INTERNET permission in the release APK
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt2
          perms=$("$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk)
          echo "$perms"
          ! echo "$perms" | grep -q 'android.permission.INTERNET'
