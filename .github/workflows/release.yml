name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Check tag matches pubspec version
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: \([^+]*\).*/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pubspec $v"; exit 1; }
      - run: tools/fetch-sqlite.sh
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build -d
      - run: flutter test
      - name: Keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CASHBANDIT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APKs
        env:
          CASHBANDIT_KEYSTORE: ${{ runner.temp }}/release.jks
          CASHBANDIT_KEYSTORE_PASSWORD: ${{ secrets.CASHBANDIT_KEYSTORE_PASSWORD }}
          CASHBANDIT_KEY_ALIAS: ${{ secrets.CASHBANDIT_KEY_ALIAS }}
          CASHBANDIT_KEY_PASSWORD: ${{ secrets.CASHBANDIT_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*release.apk; do
            n=$(basename "$f" | sed "s/^app/cashbandit-${GITHUB_REF_NAME}/")
            cp "$f" "dist/$n"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Changelog from fastlane metadata
        run: |
          code=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          {
            cat "fastlane/metadata/android/de-DE/changelogs/$code.txt"
            echo
            cat "fastlane/metadata/android/en-US/changelogs/$code.txt"
            echo
            echo "**APK:** \`arm64-v8a\` für fast alle aktuellen Handys, \`universal\` = \`cashbandit-${GITHUB_REF_NAME}-release.apk\`. Prüfsummen: \`SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
