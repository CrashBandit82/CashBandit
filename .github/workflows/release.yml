# Release APKs are NOT built here: they are built reproducibly in the F-Droid
# build environment, signed offline and uploaded to the GitHub release by hand,
# so that F-Droid can verify them (Reproducible Builds). This workflow only
# checks that a tagged commit is consistent and passes the tests.
name: Release check

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Check tag matches pubspec version
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: \([^+]*\).*/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pubspec $v"; exit 1; }
      - run: tools/fetch-sqlite.sh
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build -d
      - run: flutter test
