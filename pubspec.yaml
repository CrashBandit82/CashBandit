name: cashbandit
description: "CashBandit – offline Kassabuch für Android: Einnahmen, Ausgaben, Kategorien, wiederkehrende Buchungen."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  fl_chart: ^1.3.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.3
  shared_preferences: ^2.5.6
  file_picker: ^13.2.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mascot.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon-legacy.png
  adaptive_icon_background: "#2E6B3A"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#1F4D30"
  image: assets/branding/splash.png
  android_12:
    color: "#1F4D30"
    image: assets/branding/splash-android12.png
  ios: false
  web: false

# Compile SQLite from source (tools/fetch-sqlite.sh) instead of downloading
# a prebuilt library – required for F-Droid, used for all builds.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
